# Shared proxy directives for the opencode upstream.
#
# The OpenHost router strips the original Host header (the app sees
# Host: 127.0.0.1:8080). opencode's server does not do strict Host
# validation, but we forward the real external host + https scheme so
# any absolute URLs it emits (share links, asset URLs) point at the
# public domain.

proxy_http_version 1.1;

# WebSocket / connection-upgrade plumbing for the PTY terminal
# endpoints (/pty/<id>/connect). $connection_upgrade is "upgrade" when
# the client sends an Upgrade header, else "close".
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Pass the external-facing host + scheme through to opencode.
proxy_set_header Host              $forward_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host  $forward_host;

# Don't buffer streaming responses. opencode streams events over SSE
# at /event and /global/event (Content-Type: text/event-stream) and
# sets x-accel-buffering: no; honour it globally so the SPA's live
# updates and PTY output arrive without proxy buffering delay.
proxy_buffering off;
proxy_request_buffering off;
