[app]
name = "opencode"
version = "0.1.0"
description = "opencode — the SST/anomalyco AI coding agent — running as a self-hosted web app on OpenHost. The zone owner gets the full browser IDE (sessions, chat, file browsing, terminal) auto-authenticated via OpenHost SSO. The Anthropic API key is pulled at boot from the OpenHost secrets service, never baked into the image or written to disk. Anonymous visitors cannot reach any route: the whole app is owner-only because every session can execute arbitrary shell commands."
authors = ["Andrew Laack <andrew@laack.co>"]

[runtime.container]
image = "Dockerfile"
# nginx front proxy port. opencode's own server binds 127.0.0.1:4096
# inside the container; nginx listens on 8080 and is what the OpenHost
# router forwards to (HTTP, SSE streaming on /event, and the PTY
# terminal upgrade endpoints).
port = 8080

[routing]
# nginx serves a static 200 on /_healthz the moment it is up, well
# before the opencode server finishes booting, so the OpenHost
# readiness probe stays green during cold start.
health_check = "/_healthz"
# No public_paths. An opencode session is arbitrary code execution on
# this container (shell tool, PTY endpoints, file writes), so the
# entire app must stay behind OpenHost zone_auth. The router rejects
# every anonymous request before it reaches the container. nginx
# additionally denies any request that does not carry the
# router-stamped X-OpenHost-Is-Owner: true header (defence in depth).

[resources]
# The opencode binary is a single native Bun executable; the heavy
# cost is agent tool execution (spawned compilers, test runners, git,
# node, python). 1 GiB / 1 core is a comfortable baseline; bump for
# memory-heavy builds.
memory_mb = 1024
cpu_cores = 1.0

[data]
# Persistent state under /data/app_data/opencode/:
#   share/   -> XDG_DATA_HOME/opencode: opencode.db (sessions,
#               messages), storage/, logs. Sessions survive restarts.
#   config/  -> XDG_CONFIG_HOME/opencode: opencode.json (model/config).
#   projects/-> the working directory the agent operates in.
# The Anthropic API key is NEVER written under app_data: it is fetched
# from the secrets service into the opencode process environment at
# boot only. See README "Credential handling".
app_data = true
app_temp_data = true

# The Anthropic API key is provisioned via the OpenHost secrets service
# rather than an env var or an on-disk file. The owner stores
# ANTHROPIC_API_KEY in the secrets app; this app fetches it at boot
# through the router-mediated service proxy using its OPENHOST_APP_TOKEN.
[[services.v2.consumes]]
service = "github.com/imbue-openhost/openhost/services/secrets"
shortname = "secrets"
version = ">=0.1.0"
grants = [{ key = "ANTHROPIC_API_KEY" }]
